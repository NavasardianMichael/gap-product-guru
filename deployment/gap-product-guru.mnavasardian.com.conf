# =============================================================================
# nginx — gap-product-guru.mnavasardian.com. Install to
# /etc/nginx/sites-available/gap-product-guru.mnavasardian.com.conf and symlink into
# sites-enabled. Paths assume APP_DIR=/home/michael/apps/gap-product-guru.
#
# One origin: Express serves the API (/api) and the built client on 127.0.0.1:9008, so the
# browser needs no CORS. nginx serves only the hashed build assets off disk.
# =============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name gap-product-guru.mnavasardian.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gap-product-guru.mnavasardian.com;

    ssl_certificate     /etc/letsencrypt/live/gap-product-guru.mnavasardian.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gap-product-guru.mnavasardian.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Vite's content-hashed bundles, straight off disk. The path runs through app/current, so a
    # release swap is picked up with no nginx reload.
    location /assets/ {
        alias /home/michael/apps/gap-product-guru/app/current/client/dist/assets/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Optional — the admin panel is open by decision (docs/CHAT_UI.md#admin-panel). To restrict it
    # here, uncomment and adjust; keep the proxy lines identical to `location /` below.
    # location ~ ^/(admin|api/admin)(/|$) {
    #     allow <office-or-vpn-cidr>;
    #     deny all;
    #     proxy_pass http://127.0.0.1:9008;
    #     ...
    # }

    location / {
        proxy_pass http://127.0.0.1:9008;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # The chat rate limiter keys on the client IP: app.ts trusts this one loopback hop
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /api/chat streams the answer as Server-Sent Events. The app also sends
        # `X-Accel-Buffering: no`; this keeps every other response unbuffered too.
        proxy_buffering off;

        proxy_connect_timeout 10s;
        # An answer streams for a while, and Gemini 5xx retries run up to the app's own 60s
        # timeout before the first token — nginx's default 60s would cut that off.
        proxy_read_timeout    120s;
        proxy_send_timeout    60s;
    }

    gzip on;
    gzip_proxied any;
    # Never add text/event-stream: compressing it buffers the chat stream.
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml;
    gzip_min_length 256;
}
